# Entry points for the AI Dev Platform (spec 0001). Install Task (https://taskfile.dev), Go 1.26 or
# newer (go.work pins the toolchain it fetches), and Docker with the Compose plugin and gVisor (runsc).
version: "3"

vars:
  COMPOSE: docker compose -f deploy/compose/compose.yaml
  # every module in go.work
  GO_PACKAGES: ./libs/... ./services/forge/... ./services/scheduler/... ./services/runner/...
  GOLANGCI_LINT_VERSION: v2.15.0
  LEFTHOOK_VERSION: v2.2.2
  SKILLS_VERSION: 1.7.6
  # go run pkg@version builds with the toolchain the tool's module asks for; golangci-lint must be
  # built with at least the toolchain go.work pins, or it refuses the code
  GO_TOOLCHAIN:
    sh: go env GOVERSION
  GOLANGCI_LINT: env GOTOOLCHAIN={{.GO_TOOLCHAIN}} go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: One time host setup with sudo; checks runsc, writes deploy/compose/.env and secrets/
    cmds:
      - sudo --preserve-env=ADP_PUBLIC_HOST deploy/compose/setup.sh

  generate:
    desc: Regenerate the sdk config getters from the catalog entries (the output is committed)
    cmds:
      - go generate ./services/forge/internal/config ./services/scheduler/internal/config ./services/runner/internal/config

  build:
    desc: Build the forge, scheduler and runner images on this host
    cmds:
      - "{{.COMPOSE}} build"

  test:
    desc: Run the Go tests with the race detector, then the integration tests (they need Docker)
    cmds:
      - go test -race {{.GO_PACKAGES}}
      - task: test:integration

  test:integration:
    desc: Run the tests behind the integration build tag against a real Postgres (needs Docker)
    cmds:
      - go test -race -tags integration ./libs/...

  lint:
    desc: Lint and check formatting of the Go code (golangci-lint, .golangci.yml)
    cmds:
      - task: lint:go

  lint:go:
    desc: Run golangci-lint on the Go code, formatters included
    cmds:
      - "{{.GOLANGCI_LINT}} run {{.GO_PACKAGES}}"

  fmt:
    desc: Format the Go code (gofumpt, goimports)
    cmds:
      - task: fmt:go

  fmt:go:
    desc: Format the Go code, or only the files after -- (the pre commit hook passes them)
    cmds:
      - "{{.GOLANGCI_LINT}} fmt {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.GO_PACKAGES}}{{end}}"

  hooks:
    desc: Install lefthook {{.LEFTHOOK_VERSION}} into your Go bin directory and the pre commit hook (lefthook.yml)
    cmds:
      - go install github.com/evilmartians/lefthook/v2@{{.LEFTHOOK_VERSION}}
      - gobin="$(go env GOBIN)"; "${gobin:-$(go env GOPATH)/bin}/lefthook" install

  skills:
    desc: Restore the agent skills in skills-lock.json into .agents/skills and link each into .claude/skills (once per clone; skills {{.SKILLS_VERSION}})
    cmds:
      # experimental_install fills only .agents/skills; Claude Code reads .claude/skills, so link each skill there
      - pnpm dlx skills@{{.SKILLS_VERSION}} experimental_install
      - mkdir -p .claude/skills
      - for dir in .agents/skills/*/; do name="$(basename "$dir")"; [ -e ".claude/skills/$name" ] || [ -L ".claude/skills/$name" ] || ln -s "../../.agents/skills/$name" ".claude/skills/$name"; done

  up:
    desc: Start the stack and wait until every service is healthy
    cmds:
      - "{{.COMPOSE}} up -d --wait --wait-timeout 180"

  down:
    desc: Stop the stack (volumes and secrets stay)
    cmds:
      - "{{.COMPOSE}} down"

  ps:
    desc: Show each service and its health
    cmds:
      - "{{.COMPOSE}} ps -a"

  logs:
    desc: Follow the stack's logs
    cmds:
      - "{{.COMPOSE}} logs -f"

  check-proxy:
    desc: Probe the socket proxy allowlist from a throwaway client (AC-3)
    cmds:
      # --use-aliases: the proxy allows clients by name, and `run` registers none without it
      - "{{.COMPOSE}} --profile checks run --rm --use-aliases --quiet-pull proxy-check"

  check-bindings:
    desc: Probe scheduler and runner with each binding token from a throwaway client (AC-8)
    cmds:
      - "{{.COMPOSE}} --profile checks run --rm --quiet-pull binding-check"

  check-secrets:
    desc: Look for leaked secrets and check secret file modes, with sudo (AC-5)
    cmds:
      - sudo deploy/compose/check-secrets.sh
