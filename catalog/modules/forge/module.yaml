apiVersion: modular-platform/v1
kind: Module
name: forge
description: The only holder of GitHub credentials; takes GitHub webhooks and posts questions and PRs.
# built on the host by `task build` (spec 0001, Images); Slice 7 decides how images reach the platform
image: adp/forge:dev
runtime: sdk
healthcheck:
  test: ["CMD", "/app/forge", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s
uses:
  postgresql:
    capability: postgresql
    client: postgresql
    env:
      url: ADP_DB_URL
      database: ADP_DB_NAME
      user: ADP_DB_USER
      password: ADP_DB_PASSWORD_FILE
      sslmode: ADP_DB_SSLMODE
  scheduler:
    capability: adp-scheduler
    client: http
    env:
      url: ADP_SCHEDULER_URL
      token: ADP_SCHEDULER_TOKEN_FILE
config:
  public-origin:
    env: ADP_PUBLIC_ORIGIN
    type: url
    description: The one public origin, https plus the host Caddy serves, used for links and checks.
  proxy-hops:
    env: ADP_PROXY_HOPS
    type: int
    default: "1"
    min: 0
    max: 1
    description: Proxies in front of forge that append X-Forwarded-For; exactly Caddy.
