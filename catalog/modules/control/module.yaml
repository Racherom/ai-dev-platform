apiVersion: modular-platform/v1
kind: Module
name: control
description: Talks to GitHub and decides which run goes next.
# built on the host by `task build` (spec 0001, Images); Slice 7 decides how images reach the platform
image: adp/control:dev
runtime: sdk
healthcheck:
  test: ["CMD", "/app/control", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s
uses:
  postgresql:
    capability: postgresql
    client: postgresql
    env:
      url: ADP_DB_URL
      database: ADP_DB_NAME
      user: ADP_DB_USER
      password: ADP_DB_PASSWORD_FILE
      sslmode: ADP_DB_SSLMODE
config:
  public-origin:
    env: ADP_PUBLIC_ORIGIN
    type: url
    description: The one public origin, https plus the host Caddy serves, used for links and checks.
  proxy-hops:
    env: ADP_PROXY_HOPS
    type: int
    default: "1"
    min: 0
    max: 1
    description: Proxies in front of control that append X-Forwarded-For; exactly Caddy.
