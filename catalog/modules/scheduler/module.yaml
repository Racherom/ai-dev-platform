apiVersion: modular-platform/v1
kind: Module
name: scheduler
description: Owns projects, tasks and runs, and decides which run goes next; holds no outside credential.
# built on the host by `task build` (spec 0001, Images); Slice 7 decides how images reach the platform
image: adp/scheduler:dev
runtime: sdk
healthcheck:
  test: ["CMD", "/app/scheduler", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s
provides:
  scheduler:
    capability: adp-scheduler
    version: "1.0"
    auth: binding-token
    fields:
      url: {platform: url}
      token: {generate: true}
      ca: {platform: ca}
    env:
      token: ADP_CLIENTS_DIR
uses:
  postgresql:
    capability: postgresql
    client: postgresql
    env:
      url: ADP_DB_URL
      database: ADP_DB_NAME
      user: ADP_DB_USER
      password: ADP_DB_PASSWORD_FILE
      sslmode: ADP_DB_SSLMODE
  runner:
    capability: adp-runner
    client: http
    env:
      url: ADP_RUNNER_URL
      token: ADP_RUNNER_TOKEN_FILE
