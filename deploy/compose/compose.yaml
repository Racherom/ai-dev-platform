# The AI Dev Platform stack (spec 0001). Run `task setup` once (it writes .env and secrets/),
# then `task up`. Only caddy publishes host ports; everything else talks on internal networks.
name: adp

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-db: &db
  ADP_DB_URL: postgres://postgres:5432
  ADP_DB_NAME: adp
  ADP_DB_PASSWORD_FILE: /run/secrets/db_password
  ADP_DB_SSLMODE: disable

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: adp_owner
      POSTGRES_DB: adp
      POSTGRES_PASSWORD_FILE: /run/secrets/adp_owner_password
    secrets:
      - source: postgres_adp_owner_password
        target: adp_owner_password
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      # over TCP: the image's first init runs a socket only server, which must not count as ready
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "adp_owner", "-d", "adp"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  migrate:
    <<: *hardened
    image: adp/control:dev
    pull_policy: never # built by the control service from the same Dockerfile
    entrypoint: ["/app/migrate"]
    restart: "no"
    environment:
      ADP_DB_HOST: postgres
      ADP_DB_PORT: "5432"
      ADP_DB_NAME: adp
      ADP_DB_OWNER_USER: adp_owner
      ADP_DB_OWNER_PASSWORD_FILE: /run/secrets/adp_owner_password
      ADP_DB_CONTROL_PASSWORD_FILE: /run/secrets/adp_control_password
      ADP_DB_RUNNER_PASSWORD_FILE: /run/secrets/adp_runner_password
    secrets:
      - source: migrate_adp_owner_password
        target: adp_owner_password
      - source: migrate_adp_control_password
        target: adp_control_password
      - source: migrate_adp_runner_password
        target: adp_runner_password
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  control:
    <<: *hardened
    build:
      context: ../../services/control
    image: adp/control:dev
    restart: unless-stopped
    environment:
      <<: *db
      MP_INSTANCE: control
      ADP_PUBLIC_ORIGIN: https://${ADP_PUBLIC_HOST:?run task setup first}
      ADP_PROXY_HOPS: "1"
      ADP_DB_USER: adp_control
    secrets:
      - source: control_db_password
        target: db_password
    networks: [edge, backend]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/control", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  runner:
    <<: *hardened
    build:
      context: ../../services/runner
    image: adp/runner:dev
    # a refused start (no runsc, proxy not up yet) exits 1; Docker retries with a growing delay
    restart: on-failure
    environment:
      <<: *db
      MP_INSTANCE: runner
      ADP_DB_USER: adp_runner
      ADP_DOCKER_HOST: tcp://socket-proxy:2375
      ADP_SANDBOX_RUNTIME: runsc
      ADP_RUN_LOGS_DIR: /var/lib/adp/run-logs
    secrets:
      - source: runner_db_password
        target: db_password
    volumes:
      - run-logs:/var/lib/adp/run-logs
    networks: [backend, engine]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/runner", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  socket-proxy:
    <<: *hardened
    image: wollomatic/socket-proxy:1.14.0
    restart: unless-stopped
    user: "65534:65534"
    group_add: ["${DOCKER_GID:?run task setup first}"]
    # the :ro flag would protect nothing (the API still accepts writes); the allowlist below does
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [engine]
    # Allowlist (spec 0001, "Socket proxy allowlist"). Every regex is anchored and accepts an
    # optional API version prefix. `$$` is compose's escape for `$`. The table test in
    # services/runner/internal/sandbox reads these exact lines. proxy-check is allowed only so
    # `task check-proxy` can probe; it exists only while that check runs.
    command:
      - -listenip=0.0.0.0
      - -proxyport=2375
      - -allowfrom=runner,proxy-check
      - -allowhealthcheck
      - -logjson
      - -allowGET=^(/v1\.[0-9]+)?/(_ping|version|info|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs)|images/[a-zA-Z0-9][a-zA-Z0-9_.:/@-]*/json|networks|networks/[a-zA-Z0-9][a-zA-Z0-9_.-]*)$$
      - -allowPOST=^(/v1\.[0-9]+)?/(containers/create|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|wait|kill)|networks/create)$$
      - -allowDELETE=^(/v1\.[0-9]+)?/(containers|networks)/[a-zA-Z0-9][a-zA-Z0-9_.-]*$$
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    # the only published ports; the host side can move for a local run, never in production
    ports:
      - "${ADP_HTTP_PORT:-80}:80"
      - "${ADP_HTTPS_PORT:-443}:443"
    environment:
      ADP_PUBLIC_HOST: ${ADP_PUBLIC_HOST:?run task setup first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # `task check-proxy` only (AC-3): a throwaway client on the engine network
  proxy-check:
    image: curlimages/curl:8.23.0
    profiles: [checks]
    entrypoint: ["/bin/sh", "/check-proxy.sh"]
    volumes:
      - ./check-proxy.sh:/check-proxy.sh:ro
    networks: [engine]
    depends_on:
      socket-proxy:
        condition: service_healthy

networks:
  # not internal: caddy's ACME traffic and control's way out to api.github.com
  edge: {}
  backend:
    internal: true
  engine:
    internal: true

volumes:
  pgdata: {}
  run-logs: {}
  caddy-data: {}
  caddy-config: {}

# One file per secret per reading service, made by setup.sh, mode 0400, owned by the reader's
# uid. Compose ignores uid and mode outside Swarm, so ownership is set on the host.
secrets:
  postgres_adp_owner_password:
    file: ../../secrets/postgres/adp_owner_password
  migrate_adp_owner_password:
    file: ../../secrets/migrate/adp_owner_password
  migrate_adp_control_password:
    file: ../../secrets/migrate/adp_control_password
  migrate_adp_runner_password:
    file: ../../secrets/migrate/adp_runner_password
  control_db_password:
    file: ../../secrets/control/db_password
  runner_db_password:
    file: ../../secrets/runner/db_password
